<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>방구석 덕질 청자 v0.2</title>
<style>
:root{
  --bg:#070916;--panel:#0f1324;--panel2:#151a30;--ink:#f5f7ff;--muted:#8d96b7;
  --line:#29304e;--cyan:#40f4e2;--pink:#ff4ca6;--violet:#8b64ff;--yellow:#ffe16b;
  --danger:#ff5c7d;--shadow:0 0 24px rgba(64,244,226,.12);
}
*{box-sizing:border-box} html{background:var(--bg)} body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;background:
radial-gradient(circle at 15% -10%,rgba(139,100,255,.18),transparent 34%),
radial-gradient(circle at 85% 0%,rgba(255,76,166,.12),transparent 30%),
linear-gradient(180deg,#070916,#090c1b 45%,#070916)}
button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:rgba(7,9,22,.72);border-left:1px solid rgba(64,244,226,.06);border-right:1px solid rgba(255,76,166,.06)}
header{position:sticky;top:0;z-index:8;padding:17px 16px 13px;background:rgba(7,9,22,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand,.backrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1,.titlearea h2{margin:0;font-size:21px}.brand small,.titlearea p{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.live{display:inline-flex;align-items:center;gap:7px;color:var(--pink);font-size:12px;font-weight:800;letter-spacing:.08em}.dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink)}
main{padding:16px 16px 112px}.btn{border:1px solid transparent;border-radius:12px;padding:11px 14px;font-weight:800;color:#07100f;background:var(--cyan);box-shadow:0 0 16px rgba(64,244,226,.15)}
.btn.secondary{background:#211b38;color:#ddd5ff;border-color:#493c7a;box-shadow:none}.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line);box-shadow:none}.btn.danger{background:#321426;color:#ff94ae;border-color:#7d2946;box-shadow:none}.btn.pink{background:var(--pink);color:white}.btn:disabled{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 11px;background:#101426;color:var(--muted)}.chip.active{color:#07100f;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 15px rgba(64,244,226,.18)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.card{width:100%;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,rgba(21,26,48,.96),rgba(11,14,29,.96));padding:0;overflow:hidden;text-align:left;color:var(--ink);box-shadow:var(--shadow)}
.poster{aspect-ratio:4/5;width:100%;object-fit:cover;display:block;background:#111528}.poster.placeholder{display:grid;place-items:center;color:var(--cyan);font-weight:900;letter-spacing:.1em;background:linear-gradient(145deg,#131830,#0d1020)}
.cardbody{padding:13px}.card h3{margin:0 0 6px;font-size:16px}.meta{font-size:12px;color:var(--muted)}.count{margin-top:10px;color:var(--cyan);font-weight:700}.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;margin-top:18px;background:rgba(15,19,36,.5)}
.back{border:0;background:transparent;color:var(--ink);font-size:28px;padding:4px}.titlewrap{display:flex;align-items:center;gap:11px;min-width:0}.miniPoster{width:46px;height:58px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#111528}.titlearea{min-width:0}.titlearea h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headline{display:flex;align-items:center;gap:8px}
.sectionbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin:15px 0 10px}.field,select,textarea,input[type=text],input[type=url]{width:100%;border:1px solid var(--line);border-radius:13px;background:#0f1427;padding:12px;color:var(--ink);outline:none}.field:focus,select:focus,textarea:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(64,244,226,.08)}
.worklink{display:inline-flex;align-items:center;gap:5px;color:var(--cyan);font-size:12px;text-decoration:none;margin-top:5px}.feed{display:flex;flex-direction:column;gap:9px;margin-top:15px}.day{font-size:11px;color:var(--muted);text-align:center;margin:12px 0 3px;letter-spacing:.06em}.post{background:linear-gradient(145deg,#11162a,#0d1121);border:1px solid var(--line);border-radius:15px;padding:12px 13px}.posthead{display:flex;justify-content:space-between;gap:8px}.posttime{font-size:11px;color:var(--muted);margin-bottom:6px}.posttext{white-space:pre-wrap;line-height:1.55}.postactions{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:9px}.source{color:var(--cyan);font-size:12px;text-decoration:none}.mini{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px 6px}
.composer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(7,9,22,.96);border-top:1px solid var(--line);z-index:10}.composerRow{display:flex;gap:8px}.composer textarea{min-height:48px;max-height:120px;resize:none}.linkRow{display:flex;gap:8px;margin-top:7px}.linkRow input{padding:10px}.send{min-width:78px;border:0;border-radius:13px;background:linear-gradient(90deg,var(--pink),#ff7bc0);color:white;font-weight:900;box-shadow:0 0 20px rgba(255,76,166,.22)}
.modalwrap{position:fixed;inset:0;background:rgba(2,3,10,.72);display:grid;place-items:end center;z-index:30}.modal{width:min(760px,100%);background:#0d1121;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 17px calc(20px + env(safe-area-inset-bottom));max-height:89vh;overflow:auto;box-shadow:0 -16px 40px rgba(0,0,0,.38)}.modal h3{margin:0 0 14px}.formrow{margin:11px 0}.formrow label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.modalactions{display:flex;gap:8px;margin-top:16px}.modalactions .btn{flex:1}.note{font-size:12px;color:var(--muted);line-height:1.55}.previewBox{display:flex;gap:12px;align-items:center;margin-top:8px}.previewBox img{width:82px;height:103px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.segmentItem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.tag{font-size:10px;border:1px solid #4b4079;color:#c7bbff;padding:3px 6px;border-radius:999px}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.sectionbar{grid-template-columns:minmax(0,1fr) auto}.sectionbar .manageBtn{grid-column:1/-1}.btn{padding:10px 12px}.card h3{font-size:15px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.sectionbar{grid-template-columns:1fr 1fr}.sectionbar select{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
<header id="homeHeader"><div class="brand"><div><div class="live"><span class="dot"></span>LIVE</div><h1>방구석 덕질 청자</h1><small>나 혼자 열고, 나 혼자 채팅 치는 덕질 생방송 · v0.2</small></div><button class="btn" id="addWorkBtn">＋ 작품</button></div></header>
<header id="workHeader" class="hidden"><div class="backrow"><div class="titlewrap"><button class="back" id="backBtn">‹</button><img id="headerPoster" class="miniPoster hidden" alt=""><div class="titlearea"><div class="headline"><h2 id="workTitle"></h2><span class="live"><span class="dot"></span>LIVE</span></div><p id="workMeta"></p><a id="workLink" class="worklink hidden" target="_blank" rel="noopener">작품 링크 열기 ↗</a></div></div></div></header>
<main>
<section id="homeView">
<div class="filters" id="filters"></div>
<div class="toolbar"><button class="btn ghost" id="exportBtn">백업 저장</button><button class="btn ghost" id="importBtn">백업 불러오기</button><input id="importFile" type="file" accept="application/json" class="hidden"></div>
<div id="workGrid" class="grid"></div><div id="homeEmpty" class="empty hidden">아직 등록한 작품이 없어.<br>첫 작품을 만들고 혼자 생방송을 열어보자.</div>
<p class="note">기록과 대표 이미지는 현재 브라우저에 저장돼. 브라우저 데이터 삭제·기기 변경 전에는 백업을 저장해두는 편이 안전해.</p>
</section>
<section id="workView" class="hidden">
<div class="sectionbar"><select id="segmentSelect"></select><button class="btn secondary" id="addSegmentBtn">＋ 기록 나누기</button><button class="btn ghost manageBtn" id="manageBtn">기록 묶음 관리</button></div>
<div id="feed" class="feed"></div><div id="feedEmpty" class="empty hidden">아직 남긴 반응이 없어.<br>보고 있는 순간을 채팅처럼 적어봐.</div>
</section>
</main>
<div id="composer" class="composer hidden"><div class="composerRow"><textarea id="postInput" placeholder="실시간 반응 남기기…"></textarea><button class="send" id="sendBtn">반응 송출</button></div><div class="linkRow"><input id="postLink" type="url" placeholder="원본 링크 붙이기 (선택)"></div></div>
</div>
<div id="modalRoot"></div>
<script>
const KEY='room_fan_listener_v02', OLD_KEY='room_fan_listener_v01';
const TYPES=['전체','애니','드라마','영화','웹툰','소설','게임','방송','SNS/숏폼','기타'];
const $=id=>document.getElementById(id); let state=load(),filter='전체',currentWorkId=null,currentSegmentId=null;
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){const old=localStorage.getItem(OLD_KEY);if(old){const d=JSON.parse(old);d.works=(d.works||[]).map(w=>({...w,url:w.url||'',poster:w.poster||'',segments:(w.segments||[]).map(s=>({...s,posts:(s.posts||[]).map(p=>({...p,url:p.url||''}))}))}));localStorage.setItem(KEY,JSON.stringify(d));raw=JSON.stringify(d);}}const p=JSON.parse(raw);return p&&Array.isArray(p.works)?p:{works:[]};}catch(_){return{works:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))} function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)} function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmt(dt){const d=new Date(dt);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`} function day(dt){const d=new Date(dt);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`} function validUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)}catch(_){return false}}
function allPosts(w){return(w.segments||[]).flatMap(s=>s.posts||[])} function workLast(w){return [...allPosts(w)].sort((a,b)=>b.createdAt-a.createdAt)[0]?.createdAt||w.createdAt} function getWork(){return state.works.find(w=>w.id===currentWorkId)}
function placeholder(type){return `<div class="poster placeholder">${esc(type||'작품')}</div>`}
function renderFilters(){const e=$('filters');e.innerHTML=TYPES.map(t=>`<button class="chip ${t===filter?'active':''}" data-type="${t}">${t}</button>`).join('');e.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.type;renderHome()})}
function renderHome(){renderFilters();const list=state.works.filter(w=>filter==='전체'||w.type===filter).sort((a,b)=>workLast(b)-workLast(a));$('workGrid').innerHTML=list.map(w=>{const count=allPosts(w).length;return `<button class="card" data-id="${w.id}">${w.poster?`<img class="poster" src="${w.poster}" alt="">`:placeholder(w.type)}<div class="cardbody"><h3>${esc(w.title)}</h3><div class="meta">${esc(w.type)} · ${(w.segments||[]).length}개 묶음</div><div class="count">반응 ${count}개</div><div class="meta">마지막 ${day(workLast(w))} ${fmt(workLast(w))}</div></div></button>`}).join('');$('homeEmpty').classList.toggle('hidden',state.works.length>0);$('workGrid').querySelectorAll('.card').forEach(c=>c.onclick=()=>openWork(c.dataset.id))}
function openWork(id){currentWorkId=id;const w=getWork();if(!w.segments?.length)w.segments=[{id:uid(),name:'전체 기록',posts:[]}];currentSegmentId=w.segments[0].id;save();$('homeView').classList.add('hidden');$('homeHeader').classList.add('hidden');$('workView').classList.remove('hidden');$('workHeader').classList.remove('hidden');$('composer').classList.remove('hidden');renderWork()}
function renderWork(){const w=getWork();if(!w)return;$('workTitle').textContent=w.title;$('workMeta').textContent=`${w.type} · 나만 보는 실시간 피드`;$('headerPoster').classList.toggle('hidden',!w.poster);if(w.poster)$('headerPoster').src=w.poster;$('workLink').classList.toggle('hidden',!validUrl(w.url));if(validUrl(w.url))$('workLink').href=w.url;$('segmentSelect').innerHTML=w.segments.map(s=>`<option value="${s.id}" ${s.id===currentSegmentId?'selected':''}>${esc(s.name)}</option>`).join('');const seg=w.segments.find(s=>s.id===currentSegmentId)||w.segments[0];currentSegmentId=seg.id;let last='';$('feed').innerHTML=(seg.posts||[]).map(p=>{const d=day(p.createdAt),dl=d!==last?`<div class="day">${d}</div>`:'';last=d;return `${dl}<article class="post"><div class="posthead"><div class="posttime">${fmt(p.createdAt)}</div><div><button class="mini" data-edit="${p.id}">수정</button><button class="mini" data-del="${p.id}">삭제</button></div></div><div class="posttext">${esc(p.text)}</div><div class="postactions">${validUrl(p.url)?`<a class="source" href="${esc(p.url)}" target="_blank" rel="noopener">원본 열기 ↗</a>`:'<span></span>'}</div></article>`}).join('');$('feedEmpty').classList.toggle('hidden',(seg.posts||[]).length>0);$('feed').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPost(b.dataset.edit));$('feed').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deletePost(b.dataset.del));setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),0)}
function modal(html){$('modalRoot').innerHTML=`<div class="modalwrap"><div class="modal">${html}</div></div>`;$('modalRoot').querySelector('.modalwrap').onclick=e=>{if(e.target.classList.contains('modalwrap'))closeModal()}} function closeModal(){$('modalRoot').innerHTML=''}
async function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),r=new FileReader();r.onerror=reject;r.onload=()=>{img.onload=()=>{const tw=480,th=600,src=img.width/img.height,target=tw/th;let sx=0,sy=0,sw=img.width,sh=img.height;if(src>target){sw=img.height*target;sx=(img.width-sw)/2}else{sh=img.width/target;sy=(img.height-sh)/2}const c=document.createElement('canvas');c.width=tw;c.height=th;c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,tw,th);resolve(c.toDataURL('image/jpeg',.76))};img.onerror=reject;img.src=r.result};r.readAsDataURL(file)})}
function workForm(w=null){return `<h3>${w?'작품 설정':'새 작품 등록'}</h3><div class="formrow"><label>작품 제목</label><input id="mTitle" type="text" value="${esc(w?.title||'')}" placeholder="예: 대도시의 사랑법"></div><div class="formrow"><label>종류</label><select id="mType">${TYPES.slice(1).map(t=>`<option ${t===w?.type?'selected':''}>${t}</option>`).join('')}</select></div><div class="formrow"><label>대표 이미지 (선택)</label><input id="mPoster" type="file" accept="image/*"><div class="previewBox"><div id="previewWrap">${w?.poster?`<img id="posterPreview" src="${w.poster}" alt="">`:''}</div><button class="btn ghost ${w?.poster?'':'hidden'}" id="removePoster" type="button">이미지 삭제</button></div></div><div class="formrow"><label>작품 대표 링크 (선택)</label><input id="mUrl" type="url" value="${esc(w?.url||'')}" placeholder="https://..."></div><p class="note">대표 이미지는 브라우저 저장 용량을 줄이기 위해 작은 포스터 비율로 압축돼.</p><div class="modalactions">${w?'<button class="btn danger" id="deleteWork">작품 삭제</button>':'<button class="btn secondary" id="cancelWork">취소</button>'}<button class="btn" id="saveWork">${w?'저장':'등록'}</button></div>`}
function bindWorkForm(w=null){let poster=w?.poster||'',removed=false;$('mPoster').onchange=async()=>{const f=$('mPoster').files[0];if(!f)return;try{poster=await compressImage(f);removed=false;$('previewWrap').innerHTML=`<img id="posterPreview" src="${poster}" alt="">`;$('removePoster').classList.remove('hidden')}catch(_){alert('이미지를 처리하지 못했어. 다른 이미지를 골라줘.')}};if($('removePoster'))$('removePoster').onclick=()=>{poster='';removed=true;$('previewWrap').innerHTML='';$('removePoster').classList.add('hidden')};if($('cancelWork'))$('cancelWork').onclick=closeModal;$('saveWork').onclick=()=>{const title=$('mTitle').value.trim(),url=$('mUrl').value.trim();if(!title){alert('작품 제목을 적어줘.');return}if(url&&!validUrl(url)){alert('링크는 http:// 또는 https:// 주소로 넣어줘.');return}if(w){w.title=title;w.type=$('mType').value;w.url=url;w.poster=removed?'':poster}else state.works.push({id:uid(),title,type:$('mType').value,url,poster,createdAt:Date.now(),segments:[{id:uid(),name:'전체 기록',posts:[]}]});try{save()}catch(_){alert('브라우저 저장공간이 부족해. 대표 이미지를 빼거나 백업 후 오래된 작품을 정리해줘.');return}closeModal();w?renderWork():renderHome()};if(w)$('deleteWork').onclick=()=>{if(confirm('작품과 그 안의 모든 기록을 삭제할까?')){state.works=state.works.filter(x=>x.id!==w.id);save();closeModal();$('backBtn').click()}}}
$('addWorkBtn').onclick=()=>{modal(workForm());bindWorkForm()};$('backBtn').onclick=()=>{currentWorkId=currentSegmentId=null;$('workView').classList.add('hidden');$('workHeader').classList.add('hidden');$('composer').classList.add('hidden');$('homeView').classList.remove('hidden');$('homeHeader').classList.remove('hidden');renderHome()};$('segmentSelect').onchange=()=>{currentSegmentId=$('segmentSelect').value;renderWork()}
$('addSegmentBtn').onclick=()=>{modal(`<h3>기록 나누기</h3><div class="formrow"><label>새 기록 묶음 이름</label><input id="mSegName" type="text" placeholder="예: 1화, 첫 시청, 8월 4일 탐라"></div><div class="modalactions"><button class="btn secondary" id="cancelSeg">취소</button><button class="btn" id="makeSeg">추가</button></div>`);$('cancelSeg').onclick=closeModal;$('makeSeg').onclick=()=>{const name=$('mSegName').value.trim();if(!name)return;const s={id:uid(),name,posts:[]};getWork().segments.push(s);currentSegmentId=s.id;save();closeModal();renderWork()}}
$('manageBtn').onclick=()=>{const w=getWork();modal(`<h3>기록 묶음 관리</h3><div id="segList">${w.segments.map((s,i)=>`<div class="segmentItem"><div>${esc(s.name)} ${i===0?'<span class="tag">기본</span>':''}<div class="meta">기록 ${(s.posts||[]).length}개</div></div><button class="btn ghost" data-rename="${s.id}">수정</button><button class="btn danger" data-rm="${s.id}" ${i===0?'disabled':''}>삭제</button></div>`).join('')}</div><div class="modalactions"><button class="btn secondary" id="closeManage">닫기</button></div>`);$('closeManage').onclick=closeModal;$('segList').querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{const s=w.segments.find(x=>x.id===b.dataset.rename),name=prompt('새 이름을 적어줘.',s.name);if(name?.trim()){s.name=name.trim();save();$('manageBtn').click();renderWork()}});$('segList').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const s=w.segments.find(x=>x.id===b.dataset.rm);if(!s)return;if(confirm(`'${s.name}' 묶음과 안의 기록 ${(s.posts||[]).length}개를 삭제할까?`)){w.segments=w.segments.filter(x=>x.id!==s.id);if(currentSegmentId===s.id)currentSegmentId=w.segments[0].id;save();$('manageBtn').click();renderWork()}})}
function addPost(){const text=$('postInput').value.trim(),url=$('postLink').value.trim();if(!text)return;if(url&&!validUrl(url)){alert('링크는 http:// 또는 https:// 주소로 넣어줘.');return}const seg=getWork()?.segments.find(s=>s.id===currentSegmentId);if(!seg)return;seg.posts.push({id:uid(),text,url,createdAt:Date.now()});$('postInput').value='';$('postLink').value='';save();renderWork()}
$('sendBtn').onclick=addPost;$('postInput').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();addPost()}}
function editPost(id){const seg=getWork().segments.find(s=>s.id===currentSegmentId),p=seg.posts.find(x=>x.id===id);modal(`<h3>반응 수정</h3><div class="formrow"><textarea id="mPost" rows="5">${esc(p.text)}</textarea></div><div class="formrow"><label>원본 링크 (선택)</label><input id="mPostUrl" type="url" value="${esc(p.url||'')}"></div><div class="modalactions"><button class="btn secondary" id="cancelPost">취소</button><button class="btn" id="savePost">저장</button></div>`);$('cancelPost').onclick=closeModal;$('savePost').onclick=()=>{const t=$('mPost').value.trim(),u=$('mPostUrl').value.trim();if(!t)return;if(u&&!validUrl(u)){alert('올바른 링크를 넣어줘.');return}p.text=t;p.url=u;save();closeModal();renderWork()}}
function deletePost(id){if(!confirm('이 반응을 삭제할까?'))return;const seg=getWork().segments.find(s=>s.id===currentSegmentId);seg.posts=seg.posts.filter(p=>p.id!==id);save();renderWork()}
$('workHeader').ondblclick=()=>{const w=getWork();modal(workForm(w));bindWorkForm(w)};$('workTitle').onclick=()=>{const w=getWork();modal(workForm(w));bindWorkForm(w)}
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`방구석덕질청자_v02_백업_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async()=>{const f=$('importFile').files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.works))throw 0;if(confirm('현재 기록을 백업 파일 내용으로 바꿀까?')){state=d;save();renderHome()}}catch(_){alert('올바른 백업 파일이 아니야.')} $('importFile').value=''}
renderHome();
</script>
</body>
</html>
